user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Empty keys are not accounted by limit_req. Preflight requests therefore
    # remain outside the authentication quota while all other requests use the
    # directly connected client IP. Do not replace this with X-Forwarded-For
    # unless a trusted proxy boundary is configured first.
    map $request_method $auth_rate_limit_key {
        default $binary_remote_addr;
        OPTIONS "";
    }

    limit_req_zone $auth_rate_limit_key zone=auth_login:10m rate=5r/m;
    limit_req_zone $auth_rate_limit_key zone=auth_register:10m rate=1r/m;
    limit_req_zone $auth_rate_limit_key zone=auth_refresh:10m rate=30r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
