<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101823" />
    <title>Sin conexión | HabitFlow</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; place-items: center; padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom)); background: #0a1017; color: #e6edf6; font-family: Inter, system-ui, sans-serif; }
      main { width: min(100%, 27rem); padding: 2rem; border: 1px solid #243244; border-radius: 1.25rem; background: #101823; box-shadow: 0 18px 50px rgba(3, 8, 15, .28); text-align: center; }
      .mark { display: grid; width: 3.5rem; height: 3.5rem; margin: 0 auto 1.25rem; place-items: center; border-radius: 1rem; background: #162130; color: #e6edf6; font-size: 1.5rem; font-weight: 800; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: .9rem 0 0; color: #93a4b8; line-height: 1.55; }
      button { min-height: 44px; margin-top: 1.5rem; padding: .65rem 1rem; border: 0; border-radius: .75rem; background: #557ee6; color: #fff; cursor: pointer; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">H</div>
      <h1>Sin conexión</h1>
      <p>HabitFlow necesita conexión para cargar tus datos.</p>
      <p>Revisa tu conexión e inténtalo nuevamente.</p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
